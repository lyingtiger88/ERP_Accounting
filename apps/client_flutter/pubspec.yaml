name: zarr
description: Zarr (زر) accounting and resource-management application for Windows and Android.
publish_to: "none"
version: 0.5.0-beta.3+7

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  path: ^1.9.1
  flutter_secure_storage: ^9.2.4
  path_provider: ^2.1.6
  sqflite: ^2.4.4
  sqflite_common: ^2.5.13
  sqflite_common_ffi: ^2.4.3
  url_launcher: ^6.3.2
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.5.0
  timezone: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/zarr.webp
