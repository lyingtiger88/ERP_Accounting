name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  api:
    name: ASP.NET Core API
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore API
        run: dotnet restore apps/server_api/ERPAccounting.Api.csproj

      - name: Restore tests
        run: dotnet restore tests/server_api_tests/ERPAccounting.Api.Tests.csproj

      - name: Build
        run: dotnet build apps/server_api/ERPAccounting.Api.csproj --configuration Release --no-restore

      - name: Test
        run: dotnet test tests/server_api_tests/ERPAccounting.Api.Tests.csproj --configuration Release --no-restore

      - name: Publish beta server
        run: dotnet publish apps/server_api/ERPAccounting.Api.csproj --configuration Release --no-restore --output artifacts/server

      - name: Upload server beta artifact
        uses: actions/upload-artifact@v6
        with:
          name: ERP-Accounting-Server-Beta
          path: artifacts/server/**
          if-no-files-found: error
          retention-days: 14

  flutter:
    name: Flutter analyze
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Packages
        working-directory: apps/client_flutter
        run: flutter pub get

      - name: Analyze
        working-directory: apps/client_flutter
        run: flutter analyze --no-fatal-infos

  android-build:
    name: Android APK smoke build
    runs-on: ubuntu-latest
    needs: flutter
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android shell
        working-directory: apps/client_flutter
        run: flutter create . --platforms=android --project-name erp_accounting

      - name: Packages
        working-directory: apps/client_flutter
        run: flutter pub get

      - name: Enable Android internet permission
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("apps/client_flutter/android/app/src/main/AndroidManifest.xml")
          text = path.read_text(encoding="utf-8")
          permission = '<uses-permission android:name="android.permission.INTERNET"/>'
          if permission not in text:
              marker = '<manifest xmlns:android="http://schemas.android.com/apk/res/android">'
              text = text.replace(marker, marker + "\n    " + permission)
              path.write_text(text, encoding="utf-8")
          PY

      - name: Build DEBUG smoke APK (not upgradeable)
        working-directory: apps/client_flutter
        run: flutter build apk --debug

      - name: Upload Android DEBUG smoke artifact
        uses: actions/upload-artifact@v6
        with:
          name: Zarr-Android-Debug-Not-For-Updates
          path: apps/client_flutter/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  windows-build:
    name: Windows executable smoke build
    runs-on: windows-latest
    timeout-minutes: 35
    needs: flutter
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Windows shell
        working-directory: apps/client_flutter
        run: flutter create . --platforms=windows --project-name erp_accounting

      - name: Packages
        working-directory: apps/client_flutter
        run: flutter pub get

      - name: Validate PowerShell maintenance scripts
        shell: pwsh
        run: |
          $scripts = @(
            "scripts/backup_server.ps1",
            "scripts/restore_server.ps1"
          )
          foreach ($script in $scripts) {
            [void][ScriptBlock]::Create(
              (Get-Content -LiteralPath $script -Raw)
            )
          }

      - name: Build Windows beta
        working-directory: apps/client_flutter
        run: flutter build windows --release

      - name: Install Inno Setup for in-place upgrades
        shell: pwsh
        run: choco install innosetup -y --no-progress
      - name: Build Windows installer with a permanent AppId
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DMySourceDir="${{ github.workspace }}\apps\client_flutter\build\windows\x64\runner\Release" /DMyOutputDir="${{ github.workspace }}\artifacts" /DMyAppVersion="0.5.${{ github.run_number }}" installer\Zarr.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
          if (-not (Test-Path artifacts/Zarr-Setup-x64.exe)) { throw "Zarr installer missing" }
      - name: Import persistent BDFR signing certificate
        if: github.event_name != 'pull_request'
        shell: pwsh
        timeout-minutes: 2
        env:
          PFX_BASE64: ${{ secrets.BDFR_CODESIGN_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.BDFR_CODESIGN_PFX_PASSWORD }}
          EXPECTED_THUMBPRINT: ${{ secrets.BDFR_CODESIGN_THUMBPRINT }}
        run: |
          $ErrorActionPreference = "Stop"
          foreach ($name in @("PFX_BASE64", "PFX_PASSWORD", "EXPECTED_THUMBPRINT")) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) { throw "Required signing secret $name is missing." }
          }
          $pfxPath = Join-Path $env:RUNNER_TEMP "BDFR-CodeSigning.pfx"
          try {
            [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:PFX_BASE64))
            $certutil = Join-Path $env:WINDIR "System32/certutil.exe"
            & $certutil -f -user -p $env:PFX_PASSWORD -importPFX My $pfxPath NoRoot
            if ($LASTEXITCODE -ne 0) { throw "certutil could not import the PFX into CurrentUser/My." }
            $cert = Get-Item "Cert:\CurrentUser\My\$env:EXPECTED_THUMBPRINT" -ErrorAction Stop
            if (-not $cert.HasPrivateKey) { throw "Imported certificate has no private key." }
            if ($cert.Thumbprint -ne $env:EXPECTED_THUMBPRINT) { throw "Imported certificate thumbprint mismatch." }
            New-Item -ItemType Directory -Force artifacts/signing | Out-Null
            Export-Certificate -Cert $cert -FilePath artifacts/signing/BDFR-CodeSigning.cer | Out-Null
            Import-Certificate -FilePath artifacts/signing/BDFR-CodeSigning.cer -CertStoreLocation "Cert:\CurrentUser\Root" -ErrorAction Stop | Out-Null
            Import-Certificate -FilePath artifacts/signing/BDFR-CodeSigning.cer -CertStoreLocation "Cert:\CurrentUser\TrustedPublisher" -ErrorAction Stop | Out-Null
            "BDFR_CODESIGN_THUMBPRINT=$($cert.Thumbprint)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
            Write-Host "Persistent BDFR certificate imported and verified: $($cert.Thumbprint)"
          }
          finally {
            if (Test-Path $pfxPath) { Remove-Item $pfxPath -Force }
          }
      - name: Sign and verify Zarr Windows binaries with persistent BDFR identity
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $sdk = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Filter signtool.exe -Recurse | Where-Object { $_.FullName -match "\\x64\\signtool.exe$" } | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $sdk) { throw "Windows SDK SignTool not found." }
          $files = @(
            Get-ChildItem "apps/client_flutter/build/windows/x64/runner/Release" -Recurse -File |
              Where-Object { $_.Extension -in ".exe", ".dll" }
            Get-Item "artifacts/Zarr-Setup-x64.exe"
          )
          if ($files.Count -lt 2) { throw "Expected Windows app binaries and installer." }
          foreach ($file in $files) {
            & $sdk.FullName sign /fd SHA256 /sha1 "$env:BDFR_CODESIGN_THUMBPRINT" $file.FullName
            if ($LASTEXITCODE -ne 0) { throw "SignTool failed: $($file.Name)" }
            & $sdk.FullName verify /pa /v $file.FullName
            if ($LASTEXITCODE -ne 0) { throw "Signature verification failed: $($file.Name)" }
          }
          $files | ForEach-Object { Get-FileHash $_.FullName -Algorithm SHA256 } |
            ForEach-Object { "$($_.Hash) *$($_.Path)" } |
            Set-Content artifacts/signing/SHA256SUMS.txt
          Write-Host "Signed and verified $($files.Count) Windows files with persistent BDFR identity."
      - name: Upload Windows update installer
        uses: actions/upload-artifact@v6
        with:
          name: Zarr-Windows-Installer
          path: artifacts/Zarr-Setup-x64.exe
          if-no-files-found: error
          retention-days: 30
      - name: Upload BDFR signing evidence
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v6
        with:
          name: Zarr-Windows-Signing-Evidence
          path: artifacts/signing/*
          if-no-files-found: error
          retention-days: 90
      - name: Upload Windows beta artifact
        uses: actions/upload-artifact@v6
        with:
          name: ERP-Accounting-Windows-Beta
          path: apps/client_flutter/build/windows/x64/runner/Release/**
          if-no-files-found: error
          retention-days: 14

