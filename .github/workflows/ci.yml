name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  api:
    name: ASP.NET Core API
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore API
        run: dotnet restore apps/server_api/ERPAccounting.Api.csproj

      - name: Restore tests
        run: dotnet restore tests/server_api_tests/ERPAccounting.Api.Tests.csproj

      - name: Build
        run: dotnet build apps/server_api/ERPAccounting.Api.csproj --configuration Release --no-restore

      - name: Test
        run: dotnet test tests/server_api_tests/ERPAccounting.Api.Tests.csproj --configuration Release --no-restore

  flutter:
    name: Flutter analyze
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Packages
        working-directory: apps/client_flutter
        run: flutter pub get

      - name: Analyze
        working-directory: apps/client_flutter
        run: flutter analyze --no-fatal-infos

  android-build:
    name: Android APK smoke build
    runs-on: ubuntu-latest
    needs: flutter
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android shell
        working-directory: apps/client_flutter
        run: flutter create . --platforms=android --project-name erp_accounting

      - name: Packages
        working-directory: apps/client_flutter
        run: flutter pub get

      - name: Enable Android internet permission
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("apps/client_flutter/android/app/src/main/AndroidManifest.xml")
          text = path.read_text(encoding="utf-8")
          permission = '<uses-permission android:name="android.permission.INTERNET"/>'
          if permission not in text:
              marker = '<manifest xmlns:android="http://schemas.android.com/apk/res/android">'
              text = text.replace(marker, marker + "\n    " + permission)
              path.write_text(text, encoding="utf-8")
          PY

      - name: Build beta release APK
        working-directory: apps/client_flutter
        run: flutter build apk --release

      - name: Upload Android beta artifact
        uses: actions/upload-artifact@v6
        with:
          name: ERP-Accounting-Android-Beta
          path: apps/client_flutter/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

  windows-build:
    name: Windows executable smoke build
    runs-on: windows-latest
    needs: flutter
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Windows shell
        working-directory: apps/client_flutter
        run: flutter create . --platforms=windows --project-name erp_accounting

      - name: Packages
        working-directory: apps/client_flutter
        run: flutter pub get

      - name: Build Windows beta
        working-directory: apps/client_flutter
        run: flutter build windows --release

      - name: Upload Windows beta artifact
        uses: actions/upload-artifact@v6
        with:
          name: ERP-Accounting-Windows-Beta
          path: apps/client_flutter/build/windows/x64/runner/Release/**
          if-no-files-found: error
          retention-days: 14

