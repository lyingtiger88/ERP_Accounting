name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: zarr-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    name: ASP.NET Core API
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore API
        run: dotnet restore apps/server_api/ERPAccounting.Api.csproj

      - name: Restore tests
        run: dotnet restore tests/server_api_tests/ERPAccounting.Api.Tests.csproj

      - name: Build
        run: dotnet build apps/server_api/ERPAccounting.Api.csproj --configuration Release --no-restore

      - name: Test
        run: dotnet test tests/server_api_tests/ERPAccounting.Api.Tests.csproj --configuration Release --no-restore

      - name: Publish beta server
        run: dotnet publish apps/server_api/ERPAccounting.Api.csproj --configuration Release --no-restore --output artifacts/server

      - name: Upload server beta artifact
        uses: actions/upload-artifact@v6
        with:
          name: ERP-Accounting-Server-Beta
          path: artifacts/server/**
          if-no-files-found: error
          retention-days: 14

  flutter:
    name: Flutter analyze
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Packages
        working-directory: apps/client_flutter
        run: flutter pub get

      - name: Analyze
        working-directory: apps/client_flutter
        run: flutter analyze --no-fatal-infos

  android-build:
    name: Android release build
    runs-on: ubuntu-latest
    needs: flutter
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android shell
        working-directory: apps/client_flutter
        env:
          EXPECTED_PACKAGE: ${{ vars.ZARR_ANDROID_APPLICATION_ID }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            flutter create . --platforms=android --project-name zarr
          else
            [[ "$GITHUB_REF" == "refs/heads/main" ]] || { echo "Release builds require main."; exit 1; }
            [[ "$EXPECTED_PACKAGE" =~ ^[A-Za-z][A-Za-z0-9_]*(\.[A-Za-z][A-Za-z0-9_]*)+\.zarr$ ]] || { echo "Configure existing ZARR_ANDROID_APPLICATION_ID; expected suffix .zarr."; exit 1; }
            flutter create . --platforms=android --project-name zarr --org "${EXPECTED_PACKAGE%.zarr}"
          fi

      - name: Install Pillow for official Zarr icon
        run: python -m pip install --disable-pip-version-check Pillow

      - name: Apply Zarr Android launcher icon and localized app name
        run: python scripts/install_zarr_icon.py

      - name: Packages
        working-directory: apps/client_flutter
        run: flutter pub get

      - name: Enable Android internet permission
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("apps/client_flutter/android/app/src/main/AndroidManifest.xml")
          text = path.read_text(encoding="utf-8")
          permission = '<uses-permission android:name="android.permission.INTERNET"/>'
          if permission not in text:
              marker = '<manifest xmlns:android="http://schemas.android.com/apk/res/android">'
              text = text.replace(marker, marker + "\n    " + permission)
              path.write_text(text, encoding="utf-8")
          PY

      - name: Compile release APK (PR validation only, not distributed)
        if: github.event_name == 'pull_request'
        working-directory: apps/client_flutter
        run: flutter build apk --release

      - name: Build release APK with monotonic version code
        if: github.event_name != 'pull_request'
        working-directory: apps/client_flutter
        env:
          VERSION_BASE: ${{ vars.ZARR_ANDROID_VERSION_CODE_BASE }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VERSION_BASE" =~ ^[0-9]+$ ]] || { echo "Configure version-code base above previously distributed builds."; exit 1; }
          code=$((10#$VERSION_BASE + GITHUB_RUN_NUMBER))
          (( code > 0 && code <= 2100000000 ))
          flutter build apk --release --build-number="$code"

      - name: Sign and verify Android release with existing publisher key
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_B64: ${{ secrets.ZARR_ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ZARR_ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.ZARR_ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ZARR_ANDROID_KEY_ALIAS }}
          EXPECTED_CERT: ${{ vars.ZARR_ANDROID_CERT_SHA256 }}
          EXPECTED_PACKAGE: ${{ vars.ZARR_ANDROID_APPLICATION_ID }}
        shell: bash
        run: |
          set -euo pipefail
          for name in KEYSTORE_B64 KS_PASS KEY_PASS KEY_ALIAS EXPECTED_CERT EXPECTED_PACKAGE; do
            [[ -n "${!name}" ]] || { echo "Missing Android release configuration: $name"; exit 1; }
          done
          umask 077
          temp_dir="$(mktemp -d)"
          trap 'rm -rf "$temp_dir"' EXIT
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$temp_dir/publisher.jks"
          sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:?}}"
          tools="$(find "$sdk/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          source_apk=apps/client_flutter/build/app/outputs/flutter-apk/app-release.apk
          mkdir -p artifacts/android
          "$tools/zipalign" -f -p 4 "$source_apk" "$temp_dir/aligned.apk"
          "$tools/apksigner" sign --ks "$temp_dir/publisher.jks" --ks-key-alias "$KEY_ALIAS" --ks-pass env:KS_PASS --key-pass env:KEY_PASS --out artifacts/android/Zarr-Android-Release.apk "$temp_dir/aligned.apk"
          "$tools/zipalign" -c -p 4 artifacts/android/Zarr-Android-Release.apk
          "$tools/apksigner" verify --verbose --print-certs artifacts/android/Zarr-Android-Release.apk > "$temp_dir/verify.txt"
          actual="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$temp_dir/verify.txt" | tr -d '[:space:]:' | tr '[:upper:]' '[:lower:]')"
          expected="$(printf '%s' "$EXPECTED_CERT" | tr -d '[:space:]:' | tr '[:upper:]' '[:lower:]')"
          [[ "$expected" =~ ^[0-9a-f]{64}$ && "$actual" == "$expected" ]] || { echo "Android certificate does not match existing publisher."; exit 1; }
          package="$("$tools/aapt" dump badging artifacts/android/Zarr-Android-Release.apk | sed -n "s/^package: name='\([^']*\)'.*/\1/p")"
          [[ "$package" == "$EXPECTED_PACKAGE" ]] || { echo "Android application ID mismatch."; exit 1; }
          sha256sum artifacts/android/Zarr-Android-Release.apk > artifacts/android/SHA256SUMS.txt

      - name: Upload signed Android release artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v6
        with:
          name: Zarr-Android-Release-Signed
          path: artifacts/android/*
          if-no-files-found: error
          retention-days: 30

  windows-build:
    name: Windows executable smoke build
    runs-on: windows-latest
    timeout-minutes: 35
    needs: flutter
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Windows shell
        working-directory: apps/client_flutter
        run: flutter create . --platforms=windows --project-name zarr

      - name: Install Pillow for official Zarr icon
        run: python -m pip install --disable-pip-version-check Pillow

      - name: Apply Zarr Windows icon and product identity
        run: python scripts/install_zarr_icon.py

      - name: Packages
        working-directory: apps/client_flutter
        run: flutter pub get

      - name: Validate PowerShell maintenance scripts
        shell: pwsh
        run: |
          $scripts = @(
            "scripts/backup_server.ps1",
            "scripts/restore_server.ps1"
          )
          foreach ($script in $scripts) {
            [void][ScriptBlock]::Create(
              (Get-Content -LiteralPath $script -Raw)
            )
          }

      - name: Build Windows beta
        working-directory: apps/client_flutter
        run: flutter build windows --release

      - name: Install Inno Setup for in-place upgrades
        shell: pwsh
        run: choco install innosetup -y --no-progress
      - name: Build Windows installer with a permanent AppId
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DMySourceDir="${{ github.workspace }}\apps\client_flutter\build\windows\x64\runner\Release" /DMyOutputDir="${{ github.workspace }}\artifacts" /DMyAppVersion="0.5.${{ github.run_number }}" installer\Zarr.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
          if (-not (Test-Path artifacts/Zarr-Setup-x64.exe)) { throw "Zarr installer missing" }
      - name: Prepare persistent BDFR signing certificate (no certificate-store writes)
        if: github.event_name != 'pull_request'
        shell: pwsh
        timeout-minutes: 1
        env:
          PFX_BASE64: ${{ secrets.BDFR_CODESIGN_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.BDFR_CODESIGN_PFX_PASSWORD }}
          EXPECTED_THUMBPRINT: ${{ secrets.BDFR_CODESIGN_THUMBPRINT }}
        run: |
          $ErrorActionPreference = "Stop"
          foreach ($name in @("PFX_BASE64", "PFX_PASSWORD", "EXPECTED_THUMBPRINT")) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) { throw "Required signing secret $name is missing." }
          }
          $pfxBytes = [Convert]::FromBase64String($env:PFX_BASE64)
          $flags = [System.Security.Cryptography.X509Certificates.X509KeyStorageFlags]::EphemeralKeySet
          $cert = [System.Security.Cryptography.X509Certificates.X509Certificate2]::new($pfxBytes, $env:PFX_PASSWORD, $flags)
          if (-not $cert.HasPrivateKey) { throw "PFX does not contain a private key." }
          if ($cert.Thumbprint -ne $env:EXPECTED_THUMBPRINT) { throw "PFX thumbprint does not match configured thumbprint." }
          New-Item -ItemType Directory -Force artifacts/signing | Out-Null
          [IO.File]::WriteAllBytes("artifacts/signing/BDFR-CodeSigning.cer", $cert.Export([System.Security.Cryptography.X509Certificates.X509ContentType]::Cert))
          $pfxPath = Join-Path $env:RUNNER_TEMP "BDFR-CodeSigning.pfx"
          [IO.File]::WriteAllBytes($pfxPath, $pfxBytes)
          "BDFR_CODESIGN_THUMBPRINT=$($cert.Thumbprint)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "BDFR_PFX_PATH=$pfxPath" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "PFX loaded and thumbprint verified; no Windows certificate-store access performed."
      - name: Sign and verify Zarr Windows binaries with persistent BDFR identity
        if: github.event_name != 'pull_request'
        shell: pwsh
        timeout-minutes: 5
        env:
          PFX_PASSWORD: ${{ secrets.BDFR_CODESIGN_PFX_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"
          if (-not (Test-Path $env:BDFR_PFX_PATH)) { throw "Prepared PFX file is missing." }
          $sdk = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Filter signtool.exe -Recurse | Where-Object { $_.FullName -match "\\x64\\signtool.exe$" } | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $sdk) { throw "Windows SDK SignTool not found." }
          $files = @(
            Get-ChildItem "apps/client_flutter/build/windows/x64/runner/Release" -Recurse -File |
              Where-Object { $_.Extension -in ".exe", ".dll" }
            Get-Item "artifacts/Zarr-Setup-x64.exe"
          )
          if ($files.Count -lt 2) { throw "Expected Windows app binaries and installer." }
          foreach ($file in $files) {
            Write-Host "Signing $($file.Name)"
            & $sdk.FullName sign /f "$env:BDFR_PFX_PATH" /p "$env:PFX_PASSWORD" /fd SHA256 $file.FullName
            if ($LASTEXITCODE -ne 0) { throw "SignTool signing failed: $($file.Name)" }
            $signature = Get-AuthenticodeSignature -FilePath $file.FullName
            if (-not $signature.SignerCertificate -or $signature.SignerCertificate.Thumbprint -ne $env:BDFR_CODESIGN_THUMBPRINT) {
              throw "Signature does not contain the expected BDFR signer: $($file.Name)"
            }
            $expectedUntrustedRoot = $signature.Status -eq "UnknownError" -and
              $signature.StatusMessage -match "root certificate which is not trusted"
            if ($signature.Status -ne "Valid" -and -not $expectedUntrustedRoot) {
              throw "Authenticode signature validation failed for $($file.Name): $($signature.Status) $($signature.StatusMessage)"
            }
            if ($expectedUntrustedRoot) {
              Write-Warning "Signature is present and signer identity matches BDFR; Windows reports the expected untrusted self-signed root. This is a trust-chain warning, not a signing failure."
            } else {
              Write-Host "Authenticode signature and trust chain are valid for $($file.Name)."
            }
          }
          $files | ForEach-Object { Get-FileHash $_.FullName -Algorithm SHA256 } |
            ForEach-Object { "$($_.Hash) *$($_.Path)" } |
            Set-Content artifacts/signing/SHA256SUMS.txt
          Remove-Item $env:BDFR_PFX_PATH -Force
          Write-Host "Signed and cryptographically checked $($files.Count) Windows files with persistent BDFR identity."
      - name: Upload Windows update installer
        uses: actions/upload-artifact@v6
        with:
          name: Zarr-Windows-Installer
          path: artifacts/Zarr-Setup-x64.exe
          if-no-files-found: error
          retention-days: 30
      - name: Upload BDFR signing evidence
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v6
        with:
          name: Zarr-Windows-Signing-Evidence
          path: artifacts/signing/*
          if-no-files-found: error
          retention-days: 90
      - name: Upload Windows beta artifact
        uses: actions/upload-artifact@v6
        with:
          name: Zarr-Windows-Beta
          path: apps/client_flutter/build/windows/x64/runner/Release/**
          if-no-files-found: error
          retention-days: 14

