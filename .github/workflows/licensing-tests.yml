name: Licensing client tests

on:
  push:
    paths:
      - "apps/client_flutter/**"
      - ".github/workflows/licensing-tests.yml"
  pull_request:
    paths:
      - "apps/client_flutter/**"
      - ".github/workflows/licensing-tests.yml"

jobs:
  flutter-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Resolve dependencies
        working-directory: apps/client_flutter
        run: flutter pub get
      - name: Run tests
        working-directory: apps/client_flutter
        run: flutter test
