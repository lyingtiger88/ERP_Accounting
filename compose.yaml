services:
  postgres:
    image: postgres:18-alpine
    container_name: erp-accounting-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: erp_accounting
      POSTGRES_USER: erp
      POSTGRES_PASSWORD: erp_dev_password
    ports:
      - "5432:5432"
    volumes:
      - erp_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp -d erp_accounting"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  erp_postgres_data:
